<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TEQZO – find and compare phones</title>
  <meta name="description" content="Search, filter and compare phone specifications. Runs entirely in your browser.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232742f5'/%3E%3Cpath d='M8 9h16v4h-6v10h-4V13H8z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;800&display=swap" rel="stylesheet">
  <script>
  // Set the theme before the page paints so there is no flash of the wrong one.
  (function () { var t; try { t = localStorage.getItem("teqzo.theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t); })();
</script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="top">
    <a class="brand" href="#/" aria-label="TEQZO home"><svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M8 9h16v4h-6v10h-4V13H8z" fill="var(--paper)"/></svg>TEQZO</a>
    <nav aria-label="Main" id="nav">
      <a href="#/" data-route="browse">Phones</a>
      <a href="#/top" data-route="top">Top lists</a>
      <a href="#/compare" data-route="compare">Compare <span class="count" id="compare-count" hidden></span></a>
      <a href="#/saved" data-route="saved">Shortlist <span class="count" id="saved-count" hidden></span></a>
      <a href="#/insights" data-route="insights">Insights</a>
      <a href="#/about" data-route="about">About</a>
    </nav>
    <button class="theme" id="theme" type="button" aria-pressed="false" aria-label="Switch theme"><i aria-hidden="true"></i><span>Dark</span></button>
  </header>
  <main id="view" tabindex="-1">
    <p class="loading">Loading phones…</p>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="loading">TEQZO needs JavaScript to search the phone data in your browser.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
